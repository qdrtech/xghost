# The knob schema of xghost.
#
# The project owns this file. It names every preference this desktop supports,
# the values that preference takes, and the value a machine takes when its own
# knobs file names none. Knobs are the third file category of
# docs/adr/0001-prescribed-config-architecture.md, and docs/knobs.md documents
# both this file and the file a user edits.
#
# The format is one record per knob. A record starts with a 'knob' line, and
# holds 'summary' once, 'value' once per allowed value, and 'default' once:
#
#   knob=KNOB_NAME
#   summary=One sentence for 'xghost settings list'.
#   value=one
#   value=another
#   default=one
#
# Every knob is chosen from the values written out here. There is no range and
# no pattern, so validation is exact membership of this list, and a settings
# application reads the same list as the choices it offers.
#
# A knob name reaches a template as '@KNOB_NAME@', and a structural choice named
# '<file>.choice.KNOB_NAME' selects one prescribed fragment per value. Adding a
# knob is adding a record here and naming it in a template. No code changes.

knob=KNOB_ANIMATIONS
summary=Whether a window animates when it opens, closes or moves.
value=on
value=off
default=on

knob=KNOB_GAP_SIZE
summary=The gap around a window, in pixels.
value=0
value=5
value=10
value=15
value=20
default=10

# Each value names a font family that one Arch package provides, and the
# package is recorded in docs/knobs.md. A family no package on the machine
# provides would leave every application falling back to a font nobody chose,
# so a value reaches this list only once the package that provides it is named.
knob=KNOB_FONT
summary=The font family of the desktop interface and of the terminal.
value=JetBrainsMono Nerd Font
value=CaskaydiaCove Nerd Font
default=JetBrainsMono Nerd Font
