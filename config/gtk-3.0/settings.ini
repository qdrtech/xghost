# The GTK 3 settings of xghost.
#
# This file is prescribed configuration. The project owns it, and 'xghost
# config link' symlinks the directory that holds it to ~/.config/gtk-3.0. Do
# not edit it: an edit dirties the checkout and conflicts on the next pull. See
# docs/adr/0001-prescribed-config-architecture.md.
#
# The colours of the active theme are not here. GTK reads this file with
# g_key_file_load_from_file, which has no include of any kind, so nothing here
# can reach the generated output. gtk.css beside this file carries the colours,
# and docs/bundles/supporting.md records the split and the measurement behind
# it.
#
# Every theme this file names is installed by install/packages/base.txt. A
# settings file that names a theme nobody installs falls back to the built-in
# Adwaita without a word, which is the one failure this file must not have.

[Settings]

# The widget theme, from adw-gtk-theme. It is the libadwaita look for GTK 3, so
# a GTK 3 application and a GTK 4 application on this desktop are drawn alike.
gtk-theme-name=adw-gtk3-dark

# The icon theme, from papirus-icon-theme.
gtk-icon-theme-name=Papirus-Dark

# Prefer the dark variant. Both themes of this project are dark, and an
# application that asks GTK for the preference reads it here.
gtk-application-prefer-dark-theme=1

# The cursor. 'default-cursors' ships one file, an index.theme that holds
# 'Inherits=Adwaita' and no cursor, so it supplies this name and redirects it.
# The cursor images come from 'adwaita-cursors', which arrives under gtk3 and
# which no manifest of this project declares. docs/bundles/supporting.md.
#
# The size is the size config/hypr/conf/cursor.conf exports as XCURSOR_SIZE and
# HYPRCURSOR_SIZE, so the pointer does not change size as it crosses from a GTK
# window to the rest of the session.
gtk-cursor-theme-name=default
gtk-cursor-theme-size=24

# The font rendering, carried over from qdrtech/dotfiles unchanged.
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintfull
gtk-xft-rgba=rgb
