# The geometry of a window: the border width and the layout.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# Neither the gaps nor the border colours are here. The gaps are a preference,
# so they are a knob, and the colours come from the palette of the active theme.
# Both reach the compositor through a generated file that hyprland.conf sources
# after this one: hypr/knobs.conf and hypr/theme.conf. See docs/knobs.md.
general {
    border_size = 1
    layout = dwindle
    resize_on_border = true
}
