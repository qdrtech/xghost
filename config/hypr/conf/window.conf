# The geometry of a window: the gaps, the border width, and the layout.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# The border colours are not here. They come from the palette of the active
# theme, through the generated hypr/theme.conf that hyprland.conf sources last.
general {
    gaps_in = 10
    gaps_out = 14
    border_size = 1
    layout = dwindle
    resize_on_border = true
}
