# The keyboard and the pointer.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# The layout is prescribed rather than read from the machine facts. 'xghost
# machine detect' does record MACHINE_KEYBOARD_LAYOUT and its variant, and a
# later slice may feed them in here. Today the layout is a preference of this
# desktop rather than a fact, so it belongs with the knobs. No knob covers it
# yet: schema/knobs.conf names every one that exists. See docs/knobs.md.
#
# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    # -1.0 to 1.0. Zero is no modification.
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}
