# The settings that belong nowhere else.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# The font of the compositor is not here. It is a preference, so it is a knob,
# and it reaches the same 'misc' block through the generated hypr/knobs.conf
# that hyprland.conf sources after this file. See docs/knobs.md.
misc {
    # The wallpaper Hyprland draws when nothing else does. It stays until the
    # backgrounds of issue #20 arrive, so the desktop is never bare.
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}
