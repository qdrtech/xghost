# What starts with the session.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# Every line names a program on the PATH, or a program at a fixed path a
# package owns. None of them names a script file, because a prescribed file
# cannot write its own location.
#
# A variable does not get one there either, and the reason was measured rather
# than assumed. hyprlang expands $XDG_CONFIG_HOME when the variable is set and
# leaves the text alone when it is not, and an exec line then goes to
# '/bin/sh -c', which expands an unset variable to nothing. So the path is
# right on a machine that set the variable and is a path under the root of the
# file system on every other one. '${XDG_CONFIG_HOME:-$HOME/.config}' is the
# one form that survives both, because hyprlang reads no '${...}'.
# docs/bundles/hyprland.md records the measurement.

# The idle daemon, which locks the session and blanks the displays. Its
# configuration is hypridle.conf beside this directory.
exec-once = hypridle

# The bar. Its configuration is config/waybar beside this directory, and
# docs/bundles/waybar.md records it. The render has to have run before this
# line: a style sheet import that reaches nothing stops Waybar from starting.
exec-once = waybar

# The notification centre. Its configuration is config/swaync beside this
# directory, and docs/bundles/swaync.md records it. The render has to have run
# before this line: a style sheet import that reaches nothing leaves the
# notifications in the packaged colours. GTK4 reports it once, as a
# Gtk-WARNING on the standard error of the daemon at startup, and the daemon
# then runs on. The bar above stops instead, which is the difference.
#
# swaync is also activated over D-Bus, by the first program that sends a
# notification and by the bell of the bar. This line starts it with the session
# instead, so the daemon is the one this project configured from the first
# login rather than from the first notification.
exec-once = swaync

# The wallpaper daemon. It carries no wallpaper yet: the backgrounds arrive with
# issue #20, and hyprpaper.conf beside this directory records what that issue
# has to supply.
exec-once = hyprpaper

# The authentication agent. Without it a polkit request has nothing to ask
# through, so pairing a device in blueman and saving a system connection in
# nm-applet both fail with no dialog at all. Those two are started below, so the
# agent that serves them belongs here.
#
# This is the one line that names an absolute path. polkit-gnome installs the
# agent in a library directory rather than on the PATH, and the same path is
# what the .desktop file of that package runs.
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# The network and bluetooth indicators.
exec-once = nm-applet --indicator
exec-once = blueman-applet

# The second detection of an installation. hyprctl answers only inside a
# session, so the installer could not read the monitors before this point: it
# recorded MACHINE_MONITOR_COUNT=unknown and rendered the fallback layout. This
# run reads the monitors and renders the theme again from them, so the
# prescribed layout is in place from the next login. A run that reads the same
# machine writes the same files. docs/installing.md records the order.
exec-once = xghost machine refresh
