# The decoration of a window: its corners, its opacity, its blur and its shadow.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# The dotfiles this bundle comes from carried a file of this name and sourced it
# from nowhere, so every decoration value the compositor ran came from the theme
# file they sourced last. The values below are those values. The blur and the
# shadow were switched off there, and they are switched off here.
# docs/bundles/hyprland.md records the eleven blur and shadow settings that the
# dead file held.
decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}
