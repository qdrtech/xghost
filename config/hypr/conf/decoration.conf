# The decoration of a window: its corners, its opacity, its blur and its shadow.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# The dotfiles this bundle comes from set these values twice: once here and once
# in a theme file that was sourced after this one and overrode every one of
# them. The values below are the ones that reached the compositor. The blur and
# the shadow were switched off there, and they are switched off here.
decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}
