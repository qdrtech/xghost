# The Hyprland configuration of xghost.
#
# This file is prescribed configuration. The project owns it, and 'xghost config
# link' symlinks the directory that holds it to ~/.config/hypr. Do not edit it:
# an edit dirties the checkout and conflicts on the next pull. See
# docs/adr/0001-prescribed-config-architecture.md.
#
# Neither the colours nor the monitor layout are here. The colours come from the
# active theme and the layout comes from the machine facts, both through the
# generated files this file sources. See docs/bundles/hyprland.md.

# -----------------------------------------------------------------------------
# The programs the keybindings name
# -----------------------------------------------------------------------------
$terminal = ghostty
$fileManager = nautilus
$menu = rofi -show drun

# -----------------------------------------------------------------------------
# The generated colours of the active theme
# -----------------------------------------------------------------------------
#
# The path is relative, and Hyprland resolves it against the directory this file
# was opened from. That directory is the link 'xghost config link' creates, so
# the path starts at the config directory of the user. 'xghost config link' also
# creates 'xghost-generated' there, which reaches the generated output. Both
# ends therefore follow XDG_CONFIG_HOME and XDG_STATE_HOME, and neither is
# written out in full.
#
# The include is not optional, because Hyprland has no optional include. A
# missing file is one named error rather than a desktop that comes up with no
# colour at all. 'xghost theme set' has to run before the first session, and
# docs/bundles/hyprland.md records that ordering.
#
# It comes first, so every file below may name $bg, $accent and the rest.
source = ../xghost-generated/hypr/colors.conf

# -----------------------------------------------------------------------------
# The generated monitor layout of this machine
# -----------------------------------------------------------------------------
#
# Written by 'xghost theme set' from the facts 'xghost machine detect' read. No
# monitor output name appears in any file the project owns.
source = ../xghost-generated/hypr/monitors.conf

# -----------------------------------------------------------------------------
# The prescribed configuration
# -----------------------------------------------------------------------------
#
# These paths are relative to this file as well, so they follow the config
# directory of the user in the same way.
source = conf/cursor.conf
source = conf/autostart.conf
source = conf/animation.conf
source = conf/decoration.conf
source = conf/layout.conf
source = conf/misc.conf
source = conf/keyboard.conf
source = conf/keybinding.conf
source = conf/layerrule.conf
source = conf/window.conf
source = conf/windowrule.conf

# -----------------------------------------------------------------------------
# The generated workspace layout of this machine
# -----------------------------------------------------------------------------
#
# Which workspace opens on which monitor. It follows the monitor layout above,
# so it is generated from the same facts.
source = ../xghost-generated/hypr/workspaces.conf

# -----------------------------------------------------------------------------
# The styling of the active theme
# -----------------------------------------------------------------------------
#
# Applied last, so the colours of the theme win over anything above.
source = ../xghost-generated/hypr/theme.conf
