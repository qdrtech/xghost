# The wallpaper daemon of xghost.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# There is no wallpaper here yet, and none is invented. The backgrounds are
# issue #20, which generates one image per theme from the palette of that theme.
# Until then hyprpaper starts, holds no image, and Hyprland draws its own
# wallpaper, which conf/misc.conf keeps switched on for exactly that reason.
#
# What issue #20 has to supply, and where each part belongs:
#
#   - One image per theme, written by the renderer into the generated output,
#     at a path such as 'hypr/background.png'.
#   - A generated 'hypr/wallpaper.conf' that names that image, holding one
#     'preload' line and one 'wallpaper' line with an empty monitor, so that
#     every display carries it and no output name is written down.
#   - One 'source' line in this file that reaches the generated file through
#     the bridge, in the form the other bundles use:
#     '../xghost-generated/hypr/wallpaper.conf'.
#
# A theme switch then writes a new image and a new file at the same paths, and
# reloading the running daemon is issue #24.

# No splash text over the wallpaper.
splash = false

# The control socket. Issue #24 reloads the wallpaper of a running daemon
# through it.
ipc = on
