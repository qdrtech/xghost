# The wallpaper daemon of xghost.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# This file names no image. The wallpaper of the desktop is the background of
# the active theme, it is generated from the palette of that theme, and the
# generated file below is where it is named. No artwork is shipped and no
# image is invented: docs/backgrounds.md records the whole of it.
#
# A build that holds no image writes the same generated file with no wallpaper
# in it, so this include always resolves. Hyprland then draws its own
# wallpaper, which conf/misc.conf keeps switched on for exactly that case.

# No splash text over the wallpaper.
splash = false

# The control socket. hyprpaper opens it only when this is on, and it is what
# both requests of 'hyprctl hyprpaper' travel over: 'wallpaper', which sets the
# wallpaper of a running daemon, and 'listactive', which prints what each
# display is showing. Without this line neither request reaches the daemon.
#
# docs/reloading.md records what a 'wallpaper' request does with a path the
# daemon already holds, and why a theme switch does not send one yet.
ipc = on

# The background of the active theme, through the bridge 'xghost config link'
# creates. Neither end of this path is written out in full: the directory it
# starts from moves with XDG_CONFIG_HOME and the bridge moves with
# XDG_STATE_HOME. 'xghost theme set' writes the file it names.
source = ../xghost-generated/hypr/wallpaper.conf
