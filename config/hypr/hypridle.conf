# The idle daemon of xghost.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    # One lock screen at a time.
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before the machine sleeps.
    before_sleep_cmd = loginctl lock-session
    # Wake the displays on resume, so a key press is not spent turning them on.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock the session after ten minutes.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Blank the displays a minute after that.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# There is no suspend listener. This desktop locks and blanks on idle, and it
# never suspends or hibernates by itself.
