# The lock screen of xghost.
#
# Prescribed configuration. See docs/adr/0001-prescribed-config-architecture.md.
#
# Every block names an empty monitor, which is how hyprlock says "every
# monitor". No output name appears here, so the lock screen is the same on a
# machine with one display and on a machine with three.
#
# The colours are literal rather than taken from the theme palette. hyprlock
# does read a 'source' line, but this project has no way to prove that offline,
# and a lock screen that fails to start is a session a user cannot get back
# into. Theming it belongs with the backgrounds of issue #20.
#
# There is no background block either. hyprlock then draws its own colour. The
# dotfiles this bundle comes from named two image files that no commit of that
# repository ever contained, so both are dropped rather than carried over.
# Issue #20 supplies the image and the block that names it.

general {
    ignore_empty_input = true
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    # A fraction of the height of the field.
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(151515)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = 40
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}

# The clock.
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# The name of the user.
label {
    monitor =
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
