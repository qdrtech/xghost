# The tmux configuration of xghost.
#
# This file is prescribed configuration. The project owns it, and 'xghost config
# link' symlinks the directory that holds it to ~/.config/tmux. Do not edit it:
# an edit dirties the checkout and conflicts on the next pull. See
# docs/adr/0001-prescribed-config-architecture.md.
#
# tmux 3.7 reads $XDG_CONFIG_HOME/tmux/tmux.conf on its own, so this file needs
# no line anywhere else to be found. It carries no colour: tmux draws its own
# status line, and docs/bundles/shell.md records why this bundle leaves it
# there rather than inventing one.
#
# Carried over from qdrtech/dotfiles, path tmux/.tmux.conf. What changed, and
# what was left behind, is recorded in docs/bundles/shell.md.

# The shell tmux opens in a new pane.
#
# This desktop ships zsh, and install/packages/base.txt declares it, so this
# names the shell of the desktop rather than the login shell of whoever starts
# the server.
set -g default-shell /usr/bin/zsh

# Reload this file.
#
# The path is expanded by a shell rather than by tmux, and that is the whole
# reason for 'run-shell'. tmux expands '$VAR' in a 'source-file' path and
# refuses '${VAR:-default}' with "invalid environment variable", so tmux alone
# can write a path that is right only while XDG_CONFIG_HOME is set. That is the
# divergence docs/adr/0002-the-bridge-to-the-generated-output.md exists to
# prevent. /bin/sh writes the default inline, so the path below is right for
# every value of XDG_CONFIG_HOME, set or unset.
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf" && tmux display-message "tmux: reloaded"'

# The mouse selects a pane, resizes one, and scrolls the history.
set -g mouse on

# No wait for an escape sequence after the escape key, which is what delays
# leaving the copy mode of an editor.
set -sg escape-time 0

# The prefix is C-a.
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Split a pane with | and with -, and drop the two keys those replace.
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Windows and panes are numbered from 1, because 0 is at the far end of the
# number row.
set -g base-index 1
set -g pane-base-index 1

# A window is renamed by what runs in it.
set-option -g allow-rename on

# Move between panes with alt and the vi direction keys.
#
# The dotfiles wrote 'm-j' in lower case for one of the four. tmux accepts it
# and binds M-j, so the key worked; the line is written like its three
# neighbours here so that a reader is not left wondering whether it did.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
