# Generated by xghost. Do not edit.
# Run 'xghost settings list' for the knobs, and 'xghost settings set' to change
# one.
#
# The compositor settings that carry a knob. hyprland.conf sources this file
# after every prescribed file, so these values win.
#
# The gap is one number for both edges: the gap between two windows and the gap
# between a window and the edge of the screen. One knob is one value, and a
# desktop whose windows sit 20 pixels apart but 14 pixels from the screen edge
# is a desktop nobody asked for.

general {
    gaps_in = 20
    gaps_out = 20
}

# The font Hyprland draws its own text in, such as the text of a group bar. The
# same family reaches the terminal through the Ghostty bundle, so one font
# serves the whole desktop.
misc {
    font_family = CaskaydiaCove Nerd Font
}
