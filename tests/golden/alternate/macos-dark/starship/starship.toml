# The whole starship configuration of xghost, rendered from the palette of the
# active theme. starship reads one file and offers no include of any kind, so
# this file is the configuration rather than a fragment of it. SwayNC is the
# only other application this project prescribes that is in that position, and
# docs/adr/0002-the-bridge-to-the-generated-output.md records both.
#
# The prescribed zsh configuration names this file in STARSHIP_CONFIG, through
# the bridge that 'xghost config link' creates. See config/zsh/.zshrc and
# docs/bundles/shell.md.
