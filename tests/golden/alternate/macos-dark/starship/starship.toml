format = """
$username$directory$git_branch$git_status$fill$python$lua$nodejs$golang$package$docker_context$jobs$time$cmd_duration$line_break
[╰─](text)$character """

add_newline = true
palette = "xghost"

# The palette of the active theme. Every colour below is named by a module of
# this file, and by nothing else.
[palettes.xghost]
bg = "#0f1115"
surface = "#1c1f26"
surface_alt = "#0f1115"
text = "#e8e8ed"
text_muted = "#a1a1aa"
accent = "#0a84ff"
accent_alt = "#64d2ff"
warn = "#ffc934"
error = "#ff453a"
success = "#34c759"

[username]
show_always = true
style_root = 'bold fg:error'
style_user = 'bold fg:warn'

[directory]
read_only = "🔒"
style = 'bold fg:accent'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = ''
truncate_to_repo = true

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:error'
symbol = ' '
format = '[on](text) [$symbol$branch ]($style)'

[git_status]
style = 'fg:success'
format = '([$all_status$ahead_behind]($style) )'

[fill]
symbol = ' '

[package]
format = 'via [🎁 $version](warn bold) '

[python]
style = 'accent_alt'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
symbol = ' '

[nodejs]
style = 'accent'
symbol = ' '
format = 'via [$symbol($version )]($style)'

[bun]
symbol = '🍔 '
style = 'success'
format = 'via [$symbol($version)]($style) '

[golang]
style = 'accent'
symbol = ' '

[haskell]
style = 'accent'
symbol = ' '

[rust]
style = 'warn'
symbol = ' '

[ruby]
style = 'accent'
symbol = ' '

[docker_context]
symbol = ' '
style = 'fg:accent_alt'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = '✦'
style = 'error'
number_threshold = 1
format = '[$symbol]($style)'

[character]
format = "$symbol"
success_symbol = "[❯](bold success)"
error_symbol = "[✗](bold error) "
vicmd_symbol = "[❮](bold success)"
disabled = false

[cmd_duration]
show_milliseconds = false
style = "bold warn"
format = "took [$duration]($style)"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
format = '[  $time ]($style)'
