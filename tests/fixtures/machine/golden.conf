# The machine facts the golden-file tests render against.
#
# ADR 0001 names the golden tests as "every theme against every template, with
# fixed machine facts and knobs". These are those fixed facts. They describe no
# real computer: they are two monitors that never change, so the committed
# output under tests/golden/ depends on the templates and the palettes alone.
#
# The second monitor is rotated and carries a scale that is not 1, because both
# reach a rendered monitor line and a fixture that used the plain values would
# not prove that they do.
#
# tests/hyprland.bats renders the one, two and three monitor layouts against
# facts of its own. This file feeds the golden output, which holds one of them.

MACHINE_FACTS_VERSION=1

MACHINE_COMPOSITOR=hyprland
MACHINE_MONITOR_COUNT=2
MACHINE_PRIMARY_MONITOR=DP-1
MACHINE_PRIMARY_SCALE=1

MACHINE_MONITOR_1_NAME=DP-1
MACHINE_MONITOR_1_DESCRIPTION=Golden Fixture Display One 0000000001
MACHINE_MONITOR_1_WIDTH=3840
MACHINE_MONITOR_1_HEIGHT=2160
MACHINE_MONITOR_1_REFRESH=60.00
MACHINE_MONITOR_1_X=0
MACHINE_MONITOR_1_Y=0
MACHINE_MONITOR_1_SCALE=1
MACHINE_MONITOR_1_TRANSFORM=0
MACHINE_MONITOR_1_FOCUSED=yes
MACHINE_MONITOR_1_MODE=3840x2160@60.00
MACHINE_MONITOR_1_POSITION=0x0

MACHINE_MONITOR_2_NAME=HDMI-A-1
MACHINE_MONITOR_2_DESCRIPTION=Golden Fixture Display Two 0000000002
MACHINE_MONITOR_2_WIDTH=2560
MACHINE_MONITOR_2_HEIGHT=1440
MACHINE_MONITOR_2_REFRESH=144.00
MACHINE_MONITOR_2_X=3840
MACHINE_MONITOR_2_Y=0
MACHINE_MONITOR_2_SCALE=1.25
MACHINE_MONITOR_2_TRANSFORM=1
MACHINE_MONITOR_2_FOCUSED=no
MACHINE_MONITOR_2_MODE=2560x1440@144.00
MACHINE_MONITOR_2_POSITION=3840x0

MACHINE_TIMEZONE=UTC
MACHINE_KEYBOARD_LAYOUT=us
MACHINE_KEYBOARD_VARIANT=none
MACHINE_KEYBOARD_MODEL=pc105
MACHINE_KEYBOARD_OPTIONS=none
MACHINE_COMPOSITOR_KB_LAYOUT=us
MACHINE_COMPOSITOR_KB_VARIANT=none

MACHINE_KEYBOARD_DEVICE_COUNT=1
MACHINE_KEYBOARD_DEVICE_MAIN=golden-fixture-keyboard
MACHINE_KEYBOARD_DEVICE_1_NAME=golden-fixture-keyboard
MACHINE_KEYBOARD_DEVICE_1_LAYOUT=us
MACHINE_POINTER_COUNT=1
