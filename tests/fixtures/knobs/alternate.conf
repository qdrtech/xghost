# The second knob set of the golden output.
#
# Every knob holds a value that is not its default, so tests/golden/alternate
# and tests/golden/default differ wherever a knob reaches the output. A knob
# that no template consumes produces two identical trees, and tests/golden.bats
# fails on that.
#
# The first knob set is the absence of this file: every knob then takes the
# default of schema/knobs.conf, which is what a machine that has never run
# 'xghost settings set' renders with.

KNOB_ANIMATIONS=off
KNOB_GAP_SIZE=20
KNOB_FONT=CaskaydiaCove Nerd Font
